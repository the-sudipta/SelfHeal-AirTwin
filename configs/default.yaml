# SelfHeal-AirTwin configuration. Every tunable value lives here; code holds no magic numbers.
# Relative paths are resolved against the project root (the parent of this configs/ folder).

data:
  raw_dir: data/raw
  processed_dir: data/processed
  checksums_file: data/checksums.sha256
  download_timeout_s: 120
  datasets:
    uci_air_quality:
      url: https://archive.ics.uci.edu/static/public/360/air+quality.zip
      archive: uci_air_quality.zip
      processed: uci_air_quality.csv
    beijing_multisite:
      url: https://archive.ics.uci.edu/static/public/501/beijing+multi+site+air+quality+data.zip
      archive: beijing_multisite.zip
      processed: beijing_multisite.csv
  uci_missing_value: -200
  beijing_missing_token: "NA"

stream:
  backend: memory           # memory (in-process replay) or kafka (Kafka + Spark Structured Streaming)
  replay_delay_s: 0.0       # pause between hourly ticks; 0 replays as fast as possible
  uci_site: uci_city        # site name given to the single UCI Air Quality device
  kafka:
    bootstrap_servers: kafka:9092    # compose service name; AIRTWIN_KAFKA_BOOTSTRAP overrides it
    topic_prefix: airtwin            # each run writes to its own topic <prefix>-<dataset>-<id>
    spark_master: local[1]           # Spark local mode, one core, for reproducible micro-batches
    spark_driver_memory: 1g
    spark_jars_dir: /opt/spark-jars  # Spark-Kafka connector JARs, verified and baked into the image
    max_offsets_per_trigger: 50000   # upper bound of Kafka records per micro-batch
    poll_timeout_s: 1.0              # wait for the next micro-batch before re-checking progress
    idle_timeout_s: 120              # stop with an error if no data arrives for this long

twin:
  min_training_rows: 200        # a sensor with fewer usable hours stays in warm-up
  trust_substitution: true      # untrusted neighbours feed their virtual value, healed ones their corrected value
  drift:
    method: both                # both, ewma or cusum (single methods are ablation settings)
    baseline_hours: 720         # 30 days after calibration: learn each sensor's normal residual
    min_baseline_points: 100    # fewer usable residuals keeps the sensor in warm-up
    min_sigma: 1.0e-6           # floor for the residual spread, avoids division by zero
    smooth_hours: 24            # rolling median of the residual: suppresses hour-long pollution episodes
    ewma_lambda: 0.05           # smoothing factor of the EWMA of standardised residuals
    ewma_limit: 8.0             # alarm when |EWMA| exceeds this many of its observed baseline spreads
    cusum_k: 0.5                # CUSUM allowance, in residual standard deviations
    cusum_h: 30.0               # CUSUM decision threshold, in residual standard deviations
    watch_level: 0.5            # drift score at which a sensor is put on watch
    confirm_hours: 24           # consecutive alarm hours before drift is confirmed
    # Defaults chosen on years 1-2 of Beijing (Supplementary S4); years 3-4 are left for evaluation.
  heal:
    enabled: true               # false: detect only, publish raw values (ablation)
    fit_hours: 168             # the correction is fitted on the last 7 days of (expected, raw) pairs
    min_pairs: 48               # fewer usable pairs: no correction yet
    gain_min_pairs: 72          # a gain needs ~3 days of varying concentrations; before that, offset only
    refit_hours: 24             # refit while a correction is active, so a growing drift stays corrected
    fit_gain: true              # fit offset and gain; false fits an offset only (ablation)
    min_gain: 0.25              # bounds that keep a correction from inverting or erasing a signal
    max_gain: 4.0
    trim_mad: 3.0               # pairs further than this many robust spreads from the first fit are ignored
    min_effect: 0.10            # a correction must change readings at the usual level by at least 10%
    min_improvement: 0.30       # and cut the median absolute residual on its window by at least 30%;
                                # otherwise an alarm is dismissed, or an active correction is retired
  feedback:
    min_relative_error: 0.05    # sensors whose correction changes readings by less than 5% are not listed
    duration_weight_days: 7.0   # a fault that has lasted this long counts double
  what_if:
    horizons_days: [7, 14, 30]
    history_hours: 336          # corrections of the last 14 days estimate how fast the error grows
    min_trend_r2: 0.5           # use the trend only if it explains half the variation; else hold the error
  model:                        # LightGBM regressor per sensor, deterministic single-thread training
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 31
    min_data_in_leaf: 20
    seed: 42
  targets:
    beijing_multisite:
      calibration_hours: 8760   # one full year, so the models see every season
      variables: [pm25, pm10, so2, no2, co, o3]
      weather: [temperature, pressure, dew_point, rain, wind_speed]
      reference: []
      use_neighbours: true      # same variable at the other sites in the same hour
      use_weather: true
      use_reference: true
      use_time: true            # hour of day as sine and cosine
    uci_air_quality:
      calibration_hours: 720    # 30 days: the record spans one year and drifts from the start
      variables: [s1_co, s2_nmhc, s3_nox, s4_no2, s5_o3]
      weather: [temperature, relative_humidity, absolute_humidity]
      reference: [co_ref, c6h6_ref, nox_ref, no2_ref]   # nmhc_ref left out: 90% missing
      use_neighbours: true
      use_weather: true
      use_reference: true
      use_time: true

experiments:
  seeds: 30                       # repetitions per setting of the Beijing drift experiments
  sensitivity_seeds: 10           # repetitions per value of the sensitivity sweeps
  workers: 6                      # parallel processes (each single-threaded); 0 = one per CPU
  results_dir: results
  reference_dir: results/reference
  tolerance: 1.0e-6               # absolute tolerance of airtwin verify
  beijing:
    variables: [pm25]             # twinned variable of the drift experiments (12 sensors)
    evaluation_start: "2015-03-01 00:00"   # years 3-4; years 1-2 were used to design the detector
    min_hours_after_onset: 4320   # every drift has at least 180 days of evaluation after onset
    drifted_sensors: 3            # sensors drifting per run, chosen at random
    magnitude: [0.20, 0.50]       # relative size of the drift (sign chosen at random)
    ramp_hours: 1440              # linear and exponential drifts reach full size after 60 days
    exp_rate: 4.0                 # curvature of the exponential drift
    drift_types: [step, linear, exponential]
    replay_days: 30               # length of the replay exported for the web twin
  uci:
    pairs:                        # low-cost sensor -> co-located reference analyzer
      s1_co: co_ref
      s2_nmhc: c6h6_ref
      s3_nox: nox_ref
      s4_no2: no2_ref
    covariates: [temperature, relative_humidity]
  baselines:
    rolling_window_hours: 168     # rolling recalibration: refit on the last 7 days ...
    rolling_every_hours: 168      # ... every 7 days
    kalman_q: 1.0e-5              # process noise of the Kalman gain tracker (per hour)
    kalman_r_scale: 1.0           # measurement noise = scale x baseline residual variance
  sensitivity:
    threshold_scales: [0.5, 0.75, 1.0, 1.5, 2.0]   # multiplies ewma_limit and cusum_h
    ewma_lambdas: [0.02, 0.05, 0.1, 0.2]
  what_if:
    check_after_days: 7           # projection made 7 days after the first correction
  throughput:
    hours: 2000                   # Beijing hours timed per backend
  smoke:                          # tiny seeded slice for CI: same code path, minutes not hours
    seeds: 1
    sensitivity_seeds: 1
    threshold_scales: [1.0, 2.0]
    ewma_lambdas: [0.05]
    ablation: [full, no_trust_substitution]
