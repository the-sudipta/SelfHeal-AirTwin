# SelfHeal-AirTwin configuration. Every tunable value lives here; code holds no magic numbers.
# Relative paths are resolved against the project root (the parent of this configs/ folder).

data:
  raw_dir: data/raw
  processed_dir: data/processed
  checksums_file: data/checksums.sha256
  download_timeout_s: 120
  datasets:
    uci_air_quality:
      url: https://archive.ics.uci.edu/static/public/360/air+quality.zip
      archive: uci_air_quality.zip
      processed: uci_air_quality.csv
    beijing_multisite:
      url: https://archive.ics.uci.edu/static/public/501/beijing+multi+site+air+quality+data.zip
      archive: beijing_multisite.zip
      processed: beijing_multisite.csv
  uci_missing_value: -200
  beijing_missing_token: "NA"

stream:
  backend: memory           # memory (in-process replay) or kafka (added in v0.4.0)
  replay_delay_s: 0.0       # pause between hourly ticks; 0 replays as fast as possible
  uci_site: uci_city        # site name given to the single UCI Air Quality device
