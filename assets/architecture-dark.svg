<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">SelfHeal-AirTwin architecture</title><desc id="desc">Verified datasets are loaded and streamed in memory or through Kafka and Spark into the twin engine, which wires the expected-value model, drift detector, self-healer and feedback; the API serves the twin to the web twin, and the experiments reproduce every result.</desc><style>
  text { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif; }
  .t { fill: #E6EDF7; font-size: 20px; font-weight: 700; }
  .s { fill: #9AABC7; font-size: 14px; }
  .k { fill: #9AABC7; font-size: 12px; letter-spacing: 1.2px; font-weight: 600; }
  .flow { stroke-dasharray: 2 14; animation: flow 4s linear infinite; }
  .back { stroke-dasharray: 10 12; animation: flow 6s linear infinite reverse; }
  .pulse { animation: pulse 4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; transform-box: fill-box; transform-origin: center; }
  .fade { animation: fade 8s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
  @keyframes flow { to { stroke-dashoffset: -96; } }
  @keyframes pulse { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.18); } }
  @keyframes fade { 0%, 100% { opacity: 0.25; } 40%, 60% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .flow, .back, .pulse, .fade { animation: none; } }
</style><rect width="1200" height="520" rx="24" fill="#0B1220"/><text x="40" y="44" class="k">ARCHITECTURE · ONE DOCKER IMAGE</text><rect x="40" y="90" width="230" height="76" rx="14" fill="#101B33" stroke="#F59E0B" stroke-width="1.5"/><text x="155.0" y="124.0" text-anchor="middle" class="t" style="font-size: 16px">UCI datasets</text><text x="155.0" y="146.0" text-anchor="middle" class="s" style="font-size: 12.5px">Beijing · Air Quality, SHA-256</text><rect x="40" y="230" width="230" height="76" rx="14" fill="#101B33" stroke="#F59E0B" stroke-width="1.5"/><text x="155.0" y="264.0" text-anchor="middle" class="t" style="font-size: 16px">Loaders</text><text x="155.0" y="286.0" text-anchor="middle" class="s" style="font-size: 12.5px">clean hourly long tables</text><rect x="345" y="90" width="250" height="76" rx="14" fill="#101B33" stroke="#60A5FA" stroke-width="1.5"/><text x="470.0" y="124.0" text-anchor="middle" class="t" style="font-size: 16px">Memory stream</text><text x="470.0" y="146.0" text-anchor="middle" class="s" style="font-size: 12.5px">in-process hourly replay</text><rect x="345" y="230" width="250" height="76" rx="14" fill="#101B33" stroke="#60A5FA" stroke-width="1.5"/><text x="470.0" y="264.0" text-anchor="middle" class="t" style="font-size: 16px">Kafka + Spark</text><text x="470.0" y="286.0" text-anchor="middle" class="s" style="font-size: 12.5px">Structured Streaming</text><rect x="670" y="160" width="230" height="76" rx="14" fill="#101B33" stroke="#2DD4BF" stroke-width="1.5"/><text x="785.0" y="194.0" text-anchor="middle" class="t" style="font-size: 16px">Twin engine</text><text x="785.0" y="216.0" text-anchor="middle" class="s" style="font-size: 12.5px">one place wires every part</text><rect x="975" y="60" width="185" height="64" rx="14" fill="#101B33" stroke="#2DD4BF" stroke-width="1.5"/><text x="1067.5" y="88.0" text-anchor="middle" class="t" style="font-size: 16px">Expected value</text><text x="1067.5" y="110.0" text-anchor="middle" class="s" style="font-size: 12.5px">LightGBM per sensor</text><rect x="975" y="140" width="185" height="64" rx="14" fill="#101B33" stroke="#F59E0B" stroke-width="1.5"/><text x="1067.5" y="168.0" text-anchor="middle" class="t" style="font-size: 16px">Drift detector</text><text x="1067.5" y="190.0" text-anchor="middle" class="s" style="font-size: 12.5px">EWMA + CUSUM</text><rect x="975" y="220" width="185" height="64" rx="14" fill="#101B33" stroke="#A78BFA" stroke-width="1.5"/><text x="1067.5" y="248.0" text-anchor="middle" class="t" style="font-size: 16px">Self-healer</text><text x="1067.5" y="270.0" text-anchor="middle" class="s" style="font-size: 12.5px">gain + offset</text><rect x="975" y="300" width="185" height="64" rx="14" fill="#101B33" stroke="#A78BFA" stroke-width="1.5"/><text x="1067.5" y="328.0" text-anchor="middle" class="t" style="font-size: 16px">Feedback</text><text x="1067.5" y="350.0" text-anchor="middle" class="s" style="font-size: 12.5px">maintenance · what-if</text><rect x="345" y="400" width="250" height="76" rx="14" fill="#101B33" stroke="#60A5FA" stroke-width="1.5"/><text x="470.0" y="434.0" text-anchor="middle" class="t" style="font-size: 16px">API · FastAPI</text><text x="470.0" y="456.0" text-anchor="middle" class="s" style="font-size: 12.5px">REST + Server-Sent Events</text><rect x="670" y="400" width="230" height="76" rx="14" fill="#101B33" stroke="#2DD4BF" stroke-width="1.5"/><text x="785.0" y="434.0" text-anchor="middle" class="t" style="font-size: 16px">Web twin</text><text x="785.0" y="456.0" text-anchor="middle" class="s" style="font-size: 12.5px">3D Beijing, live</text><rect x="40" y="400" width="230" height="76" rx="14" fill="#101B33" stroke="#9AABC7" stroke-width="1.5"/><text x="155.0" y="434.0" text-anchor="middle" class="t" style="font-size: 16px">Experiments</text><text x="155.0" y="456.0" text-anchor="middle" class="s" style="font-size: 12.5px">reproduce · verify</text><line x1="155" y1="166" x2="155" y2="228" stroke="#1F2C49" stroke-width="3"/