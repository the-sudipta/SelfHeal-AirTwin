<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title desc"><title id="title">SelfHeal-AirTwin closed loop</title><desc id="desc">Sensor readings stream through Kafka and Spark into the digital twin, which detects and heals drift and sends corrections and a maintenance list back to the city.</desc><style>
  text { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif; }
  .t { fill: #E6EDF7; font-size: 20px; font-weight: 700; }
  .s { fill: #9AABC7; font-size: 14px; }
  .k { fill: #9AABC7; font-size: 12px; letter-spacing: 1.2px; font-weight: 600; }
  .flow { stroke-dasharray: 2 14; animation: flow 4s linear infinite; }
  .back { stroke-dasharray: 10 12; animation: flow 6s linear infinite reverse; }
  .pulse { animation: pulse 4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; transform-box: fill-box; transform-origin: center; }
  .fade { animation: fade 8s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
  @keyframes flow { to { stroke-dashoffset: -96; } }
  @keyframes pulse { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.18); } }
  @keyframes fade { 0%, 100% { opacity: 0.25; } 40%, 60% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .flow, .back, .pulse, .fade { animation: none; } }
</style><rect width="1200" height="400" rx="24" fill="#0B1220"/><text x="40" y="38" class="k">SELFHEAL-AIRTWIN · THE CLOSED LOOP</text><rect x="40" y="60" width="250" height="170" rx="18" fill="#101B33" stroke="#24365C" stroke-width="1.5"/><rect x="40" y="60" width="6" height="170" rx="3" fill="#F59E0B"/><text x="62" y="94" class="k">1 · PHYSICAL CITY</text><text x="62" y="122" class="t">Low-cost sensors</text><text x="62" y="152" class="s">12 PM2.5 sites, hourly</text><text x="62" y="174" class="s">readings drift over time</text><rect x="345" y="60" width="250" height="170" rx="18" fill="#101B33" stroke="#24365C" stroke-width="1.5"/><rect x="345" y="60" width="6" height="170" rx="3" fill="#60A5FA"/><text x="367" y="94" class="k">2 · BIG-DATA STREAM</text><text x="367" y="122" class="t">Kafka + Spark</text><text x="367" y="152" class="s">every reading, every hour</text><text x="367" y="174" class="s">or in-memory replay</text><rect x="650" y="60" width="250" height="170" rx="18" fill="#101B33" stroke="#24365C" stroke-width="1.5"/><rect x="650" y="60" width="6" height="170" rx="3" fill="#2DD4BF"/><text x="672" y="94" class="k">3 · DIGITAL TWIN</text><text x="672" y="122" class="t">Expect · detect · heal</text><text x="672" y="152" class="s">expected value per sensor</text><text x="672" y="174" class="s">drift score, online correction</text><rect x="955" y="60" width="250" height="170" rx="18" fill="#101B33" stroke="#24365C" stroke-width="1.5"/><rect x="955" y="60" width="6" height="170" rx="3" fill="#A78BFA"/><text x="977" y="94" class="k">4 · FEEDBACK</text><text x="977" y="122" class="t">Maintenance + what-if</text><text x="977" y="152" class="s">which sensor to visit first</text><text x="977" y="174" class="s">error if left uncorrected</text><line x1="296" y1="145.0" x2="337" y2="145.0" stroke="#1F2C49" stroke-width="4" stroke-linecap="round"/><line x1="296" y1="145.0" x2="337" y2="145.0" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round" class="flow"/><path d="M335 138.0 L344 145.0 L335 152.0" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="601" y1="145.0" x2="642" y2="145.0" stroke="#1F2C49" stroke-width="4" stroke-linecap="round"/><line x1="601" y1="145.0" x2="642" y2="145.0" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round" class="flow"/><path d="M640 138.0 L649 145.0 L640 152.0" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="906" y1="145.0" x2="947" y2="145.0" stroke="#1F2C49" stroke-width="4" stroke-linecap="round"/><line x1="906" y1="145.0" x2="947" y2="145.0" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round" class="flow"/><path d="M945 138.0 L954 145.0 L945 152.0" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M165.0 238 C 165.0 340, 1080.0 340, 1080.0 238" fill="none" stroke="#1F2C49" stroke-width="4"/><path d="M165.0 238 C 165.0 340, 1080.0 340, 1080.0 238" fill="none" stroke="#A78BFA" stroke-width="4" stroke-linecap="round" class="back"/><path d="M158.0 248 L165.0 238 L172.0 248" fill="none" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="600.0" y="326" text-anchor="middle" class="s" fill="#A78BFA" style="fill: #A78BFA; font-weight: 600">corrected values and the maintenance list flow back to the city: a twin, not a shadow</text><circle cx="240" cy="90" r="4" fill="#F59E0B" class="pulse" style="animation-delay: 0.0s"/><circle cx="254" cy="90" r="4" fill="#F59E0B" class="pulse" style="animation-delay: 0.6s"/><circle cx="268" cy="90" r="4" fill="#F59E0B" class="pulse" style="animation-delay: 1.2s"/></svg>
