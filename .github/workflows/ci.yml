name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest -q --cov --cov-report=term

  image:
    name: Container image and Kafka + Spark backend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image (downloads and verifies the datasets)
        run: docker compose build --build-arg VERSION=ci --build-arg REVISION=${{ github.sha }}

      - name: Health check command
        run: docker compose run --rm twin check

      - name: Replay smoke test on the memory backend
        run: docker compose run --rm twin replay --limit 500

      - name: Reproduce smoke test (seeded slice of every experiment, then verify)
        run: |
          # the container runs as a non-root user; let it write into the mounted results folder
          chmod -R a+rwX results
          docker compose run --rm twin reproduce --smoke

      - name: Live twin smoke test (API and web twin on the memory backend)
        run: |
          docker compose up -d twin
          bash .github/live-check.sh 8080
          docker compose stop twin

      - name: Start Kafka
        run: docker compose --profile kafka up -d --wait kafka

      - name: Kafka + Spark integration test
        run: >
          docker compose --profile kafka run --rm
          -e AIRTWIN_KAFKA_TEST_BOOTSTRAP=kafka:9092
          -v "$PWD/tests:/app/tests:ro"
          --entrypoint python twin-kafka
          -m pytest -q -p no:cacheprovider tests/test_kafka_stream.py

      - name: Replay smoke test on the Kafka + Spark backend
        run: docker compose --profile kafka run --rm twin-kafka --backend kafka replay --limit 200

      - name: Live twin smoke test on the Kafka + Spark backend
        run: |
          docker compose --profile kafka up -d twin-kafka
          bash .github/live-check.sh 8081

      - name: Stop services
        if: always()
        run: docker compose --profile kafka down --volumes
